name: Pre-release on PR label (hardened)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

# Only one release job runs per PR at a time.
# If someone manages to double-click the label, the first run wins.
concurrency:
  group: prerelease-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prerelease:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'pre-release'

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Source of truth: always the PR-branch package.json, never the base branch.
      - name: Read base version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "base_version=$VERSION" >> "$GITHUB_OUTPUT"

      # Every label-add = a brand-new release with the next counter.
      # Format: v{branch-version}-pre-release-0.{N}
      # e.g.  v5.2.0-pre-release-0.1  →  v5.2.0-pre-release-0.2  →  …
      # Counter is scoped to the version so a version bump resets numbering naturally.
      - name: Resolve next release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          set -euo pipefail

          PREFIX="v${BASE_VERSION}-pre-release-0."

          # Fetch all tags (paginated — no cap).
          # API call is kept separate from grep so only "no matches" is suppressed,
          # not a real API/network failure.
          ALL_TAGS=$(gh api "repos/${REPO}/tags" --paginate --jq '.[].name')

          MAX=$(echo "${ALL_TAGS}" \
            | grep -E "^${PREFIX}[0-9]+$" \
            | sed -E "s/^${PREFIX}//" \
            | sort -n | tail -1 || true)

          NEXT=$(( ${MAX:-0} + 1 ))
          TAG="${PREFIX}${NEXT}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"


      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Package artifact
        run: |
          tar -czf /tmp/prerelease-artifact.tar.gz \
            --exclude=./.git \
            --exclude=./node_modules \
            .
          mv /tmp/prerelease-artifact.tar.gz prerelease-artifact.tar.gz

      # Every run creates a fresh release — never updates an existing one.
      - name: Create pre-release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            Automated pre-release for PR #${{ github.event.pull_request.number }}
            Source branch: `${{ github.event.pull_request.head.ref }}`
            Commit: `${{ github.event.pull_request.head.sha }}`
          files: |
            prerelease-artifact.tar.gz

      # Replace this step with your real deploy command and emit the live URL.
      - name: Set preview URL placeholder
        id: preview
        run: |
          echo "url=" >> "$GITHUB_OUTPUT"

      - name: Upsert PR comment with release details
        uses: actions/github-script@v7
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
          TAG: ${{ steps.tag.outputs.tag }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          MARKER: "<!-- prerelease-comment -->"
        with:
          script: |
            const marker   = process.env.MARKER;
            const releaseUrl = process.env.RELEASE_URL;
            const tag       = process.env.TAG;
            const previewUrl = process.env.PREVIEW_URL;

            let body = `${marker}
            ✅ Pre-release ready: **${tag}**
            🔗 Release: ${releaseUrl}`;

            if (previewUrl && previewUrl.trim().length > 0) {
              body += `\n🌐 Preview: ${previewUrl}`;
            }

            const { owner, repo } = context.repo;
            const issue_number    = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }

