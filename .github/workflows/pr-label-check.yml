name: PR Label Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

jobs:
  validate-label:
    runs-on: ubuntu-latest
    steps:
      - name: Require release label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          echo "Labels: $LABELS"
          if echo "$LABELS" | grep -qiE '"(major|minor|patch|bug|same version)"'; then
            echo "Required release label present."
          else
            echo "::error::PR must have at least one of these labels: major, minor, patch, bug, same version"
            exit 1
          fi
