name: Mark pre-release environments closed on PR close

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # The preview environments are pre-created and shared (via rotation), so we
      # don't delete them. We just annotate the PR comment so reviewers know the
      # preview slots have been released back to the pool.
      - name: Mark PR comment as closed
        uses: actions/github-script@v7
        env:
          MARKER: "<!-- prerelease-comment -->"
        with:
          script: |
            const marker = process.env.MARKER;
            const { owner, repo } = context.repo;
            const issue_number    = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (!existing) return;

            const updated = existing.body +
              `\n\n> ⚠️ PR closed — preview environment slots have been released back to the pool.`;

            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id, body: updated
            });
